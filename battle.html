 if(j===3)return w[11]+' +20% · '+w[12]+' +10%';
 if(j===2){
 if(i===3)return w[12]+' +'+v();
 if([0,8,13,4,6,11].includes(i))return ([4,6,11].includes(i)?w[4]+' · ':'')+w[2]+' −'+v();
 return w[3]+' +'+v()+(i!==2?' · CRIT +'+v(1):'');
 }
 const hit=pct(actCoef(x))+' ATK';
 if([0,1,2,14].includes(i))return w[1]+' · '+hit+(i===0?' · '+w[3]+' −'+v(1)+' / 8 s':'');
 if(i===3)return 'ATK +'+v()+' · CRIT +10% / 8 s';
 if(i===4||i===11)return (i===11?w[4]+' · ':'')+w[2]+' −'+v()+' / 8 s';
 if(i===6)return w[4]+' · '+w[8]+' ×0.75 / '+Number(val(x,2).toFixed(1))+' s';
 if(i===8)return w[9]+' ×4 · ATK −'+v()+' / 8 s';

 if(i===10||i===12)return w[7]+' ×3 · '+hit+(i===12?' · '+w[10]+' −25% / 8 s':'');
 return hit+' × '+({5:20,7:3,9:16}[i])+' '+w[6]+(i===5?' · DEF −5% ×5':i===7?' · ATK +12% ×5':'');
}

function stage(c){return c.rank===40?(c.goldSteps||0)+((c.goldSteps===20&&c.redSteps)||0):0}
function stageKey(c){return stage(c)?'promotion-'+stage(c):c.rank}
function documented(c){
 const n=stage(c);
 const level=c.rank||0;
 if(n===13||n===14){
   const base=n===13?[8427,788,12.3,24.5]:[8790,812,12.6,25];
   return [base[0]+1500,base[1],base[2],base[3]+5+2.5]
 }
 if(n>0){
   // Interpolate total attributes between the observed baseline and the gold checkpoint.
   if(n<13)return [3903+(9927-3903)*n/13,453+335*n/13,7.5+4.8*n/13,20+12*n/13].map((v,k)=>k<2?Math.round(v):Number(v.toFixed(2)));
   const anchor=[10290,812,12.6,32.5],growth=[363,24,0.3,0.5];
   return anchor.map((base,i)=>{
     for(let step=n;step>=14;step--){
       const input=c.weaponRanks?.['promotion-'+step]?.[i];
       if(!Number.isFinite(input)&&step!==14)continue;
       const delta=c.previewGrowth===false?0:(n-step)*growth[i];
       return Number(((input??base)+delta).toFixed(2));
     }
   });
 }
 const ratio=level/40;
 const attack=Math.round(1134+2269*ratio),defense=Math.round(151+302*ratio);
 return [attack+250*(Number(level>=10)+Number(level>=30)),defense,
   Number((1.5+6*ratio).toFixed(2)),5+10*ratio+2.5*(Number(level>=20)+Number(level>=40))]

}
